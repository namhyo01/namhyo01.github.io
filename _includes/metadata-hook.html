<!--
  브라우저 UI(모바일 주소창) 색을 실제 적용된 테마에 맞춥니다.

  테마 기본값은 `theme-color` 메타 두 개가 prefers-color-scheme 으로만 갈라져 있어서,
  OS가 라이트인데 사이트에서 수동으로 다크를 고르면 주소창만 밝은 채로 남습니다.
  Chirpy가 <html> 에 실어주는 data-bs-theme 을 따라가도록 바꿉니다.

  주의: 프로덕션 빌드는 HTML을 한 줄로 압축합니다. 아래 스크립트에 `//` 줄 주석을 쓰면
  뒤따르는 코드가 전부 주석 처리되어 버리므로 블록 주석만 사용합니다.
-->
<script>
  (function () {
    var COLORS = { light: '#f7f7f7', dark: '#1b1b1e' };
    var metas = document.querySelectorAll('meta[name="theme-color"]');
    if (!metas.length) return;
    /* media 로 갈라진 메타를 하나로 합쳐 스크립트가 값을 통제하게 합니다. */
    var meta = metas[0];
    for (var i = 1; i < metas.length; i++) { metas[i].remove(); }
    meta.removeAttribute('media');
    var media = window.matchMedia('(prefers-color-scheme: dark)');
    function apply() {
      var mode = document.documentElement.getAttribute('data-bs-theme');
      /* 아직 '시스템' 상태면 OS 설정을 따릅니다. */
      if (mode !== 'light' && mode !== 'dark') { mode = media.matches ? 'dark' : 'light'; }
      meta.setAttribute('content', COLORS[mode]);
    }
    apply();
    /* 테마 스크립트가 data-bs-theme 을 바꾸는 시점을 따라갑니다. */
    new MutationObserver(apply).observe(document.documentElement, {
      attributes: true,
      attributeFilter: ['data-bs-theme']
    });
    if (media.addEventListener) { media.addEventListener('change', apply); }
    else if (media.addListener) { media.addListener(apply); }
  })();
</script>

<!--
  글 카드 위에서 마우스를 따라다니는 광원의 좌표를 넘겨줍니다.
  실제 그리기는 CSS(.card-wrapper::before)가 하고, 여기서는 --mx / --my 만 갱신합니다.

  주의: 프로덕션 빌드는 HTML을 한 줄로 압축하므로 블록 주석만 사용합니다.
-->
<script>
  (function () {
    if (!window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    var pending = null;

    function track(event) {
      var card = event.target instanceof Element
        ? event.target.closest('#post-list .card-wrapper')
        : null;
      if (!card) return;
      if (pending) return;
      /* 포인터 이벤트는 초당 수백 번 오므로 프레임당 한 번만 반영합니다. */
      pending = requestAnimationFrame(function () {
        pending = null;
        var box = card.getBoundingClientRect();
        card.style.setProperty('--mx', (event.clientX - box.left).toFixed(1) + 'px');
        card.style.setProperty('--my', (event.clientY - box.top).toFixed(1) + 'px');
      });
    }

    document.addEventListener('pointermove', track, { passive: true });
  })();
</script>

<!--
  예전에 설치된 서비스 워커를 제거합니다.

  PWA 캐시를 끄기 전에 방문한 사람들의 브라우저에는 페이지와 CSS를 캐시 우선으로
  서빙하는 워커가 남아 있습니다. 그대로 두면 아무리 배포해도 예전 화면이 보이고
  '새 콘텐츠가 있습니다' 팝업이 계속 뜹니다. 워커 스크립트 자체는 내용이 바뀌지
  않아 브라우저가 알아서 갱신하지도 않으므로, 여기서 직접 등록을 해제합니다.

  새 등록은 _config.yml 의 pwa.cache.enabled 를 비워 막아 두었습니다.

  주의: 프로덕션 빌드는 HTML을 한 줄로 압축하므로 블록 주석만 사용합니다.
-->
<script>
  (function () {
    if (!('serviceWorker' in navigator)) return;

    navigator.serviceWorker.getRegistrations().then(function (regs) {
      regs.forEach(function (reg) { reg.unregister(); });
    }).catch(function () { /* 지원하지 않는 환경은 조용히 넘어갑니다 */ });

    if (window.caches && caches.keys) {
      caches.keys().then(function (keys) {
        keys.forEach(function (key) { caches.delete(key); });
      }).catch(function () {});
    }
  })();
</script>

<!--
  커서를 따라다니는 링.

  마우스가 있는 기기에서만 만들고, 움직임을 줄이도록 설정한 사용자에게는 만들지
  않습니다. 좌표는 rAF 루프에서 목표 지점으로 조금씩 다가가게 해(lerp) 살짝
  늦게 따라오는 느낌을 냅니다.

  주의: 프로덕션 빌드는 HTML을 한 줄로 압축하므로 블록 주석만 사용합니다.
-->
<script>
  (function () {
    if (!window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    function start() {
      var ring = document.createElement('div');
      ring.id = 'cursor-ring';
      ring.setAttribute('aria-hidden', 'true');
      document.body.appendChild(ring);

      var x = 0, y = 0, targetX = 0, targetY = 0, seen = false;

      document.addEventListener('pointermove', function (event) {
        targetX = event.clientX;
        targetY = event.clientY;
        if (!seen) {
          /* 첫 움직임에서는 순간이동시켜, 화면 구석에서 날아오지 않게 합니다. */
          x = targetX;
          y = targetY;
          seen = true;
          ring.classList.add('is-visible');
        }
        var hit = event.target instanceof Element
          ? event.target.closest('a, button, .card-wrapper, .post-tag, #search-input')
          : null;
        ring.classList.toggle('is-active', !!hit);
      }, { passive: true });

      /* 창 밖으로 나가면 숨깁니다. */
      document.addEventListener('mouseleave', function () {
        ring.classList.remove('is-visible');
      });
      document.addEventListener('mouseenter', function () {
        if (seen) ring.classList.add('is-visible');
      });

      (function loop() {
        x += (targetX - x) * 0.2;
        y += (targetY - y) * 0.2;
        ring.style.transform = 'translate(' + x.toFixed(1) + 'px, ' + y.toFixed(1) + 'px)';
        requestAnimationFrame(loop);
      })();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', start);
    } else {
      start();
    }
  })();
</script>
