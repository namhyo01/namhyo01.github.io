<!--
  브라우저 UI(모바일 주소창) 색을 실제 적용된 테마에 맞춥니다.

  테마 기본값은 `theme-color` 메타 두 개가 prefers-color-scheme 으로만 갈라져 있어서,
  OS가 라이트인데 사이트에서 수동으로 다크를 고르면 주소창만 밝은 채로 남습니다.
  Chirpy가 <html> 에 실어주는 data-bs-theme 을 따라가도록 바꿉니다.

  주의: 프로덕션 빌드는 HTML을 한 줄로 압축합니다. 아래 스크립트에 `//` 줄 주석을 쓰면
  뒤따르는 코드가 전부 주석 처리되어 버리므로 블록 주석만 사용합니다.
-->
<script>
  (function () {
    var COLORS = { light: '#f7f7f7', dark: '#1b1b1e' };
    var metas = document.querySelectorAll('meta[name="theme-color"]');
    if (!metas.length) return;
    /* media 로 갈라진 메타를 하나로 합쳐 스크립트가 값을 통제하게 합니다. */
    var meta = metas[0];
    for (var i = 1; i < metas.length; i++) { metas[i].remove(); }
    meta.removeAttribute('media');
    var media = window.matchMedia('(prefers-color-scheme: dark)');
    function apply() {
      var mode = document.documentElement.getAttribute('data-bs-theme');
      /* 아직 '시스템' 상태면 OS 설정을 따릅니다. */
      if (mode !== 'light' && mode !== 'dark') { mode = media.matches ? 'dark' : 'light'; }
      meta.setAttribute('content', COLORS[mode]);
    }
    apply();
    /* 테마 스크립트가 data-bs-theme 을 바꾸는 시점을 따라갑니다. */
    new MutationObserver(apply).observe(document.documentElement, {
      attributes: true,
      attributeFilter: ['data-bs-theme']
    });
    if (media.addEventListener) { media.addEventListener('change', apply); }
    else if (media.addListener) { media.addListener(apply); }
  })();
</script>

<!--
  글 카드 위에서 마우스를 따라다니는 광원의 좌표를 넘겨줍니다.
  실제 그리기는 CSS(.card-wrapper::before)가 하고, 여기서는 --mx / --my 만 갱신합니다.

  주의: 프로덕션 빌드는 HTML을 한 줄로 압축하므로 블록 주석만 사용합니다.
-->
<script>
  (function () {
    if (!window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    var pending = null;

    function track(event) {
      var card = event.target instanceof Element
        ? event.target.closest('#post-list .card-wrapper')
        : null;
      if (!card) return;
      if (pending) return;
      /* 포인터 이벤트는 초당 수백 번 오므로 프레임당 한 번만 반영합니다. */
      pending = requestAnimationFrame(function () {
        pending = null;
        var box = card.getBoundingClientRect();
        card.style.setProperty('--mx', (event.clientX - box.left).toFixed(1) + 'px');
        card.style.setProperty('--my', (event.clientY - box.top).toFixed(1) + 'px');
      });
    }

    document.addEventListener('pointermove', track, { passive: true });
  })();
</script>

<!--
  예전에 설치된 서비스 워커를 제거합니다.

  PWA 캐시를 끄기 전에 방문한 사람들의 브라우저에는 페이지와 CSS를 캐시 우선으로
  서빙하는 워커가 남아 있습니다. 그대로 두면 아무리 배포해도 예전 화면이 보이고
  '새 콘텐츠가 있습니다' 팝업이 계속 뜹니다. 워커 스크립트 자체는 내용이 바뀌지
  않아 브라우저가 알아서 갱신하지도 않으므로, 여기서 직접 등록을 해제합니다.

  새 등록은 _config.yml 의 pwa.cache.enabled 를 비워 막아 두었습니다.

  주의: 프로덕션 빌드는 HTML을 한 줄로 압축하므로 블록 주석만 사용합니다.
-->
<script>
  (function () {
    if (!('serviceWorker' in navigator)) return;

    navigator.serviceWorker.getRegistrations().then(function (regs) {
      regs.forEach(function (reg) { reg.unregister(); });
    }).catch(function () { /* 지원하지 않는 환경은 조용히 넘어갑니다 */ });

    if (window.caches && caches.keys) {
      caches.keys().then(function (keys) {
        keys.forEach(function (key) { caches.delete(key); });
      }).catch(function () {});
    }
  })();
</script>

<!--
  마우스 인터랙션 묶음: 커서 링 · 트레일 · 클릭 물결 · 배경 오로라.

  그리기는 전부 CSS 가 하고, 여기서는 좌표와 요소 생성만 맡습니다.
  마우스가 있는 기기에서만 동작하고, 움직임을 줄이도록 설정한 사용자에게는
  아무것도 만들지 않습니다.

  주의: 프로덕션 빌드는 HTML을 한 줄로 압축하므로 블록 주석만 사용합니다.
-->
<script>
  (function () {
    if (!window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    function start() {
      var body = document.body;

      var ring = document.createElement('div');
      ring.id = 'cursor-ring';
      ring.setAttribute('aria-hidden', 'true');
      body.appendChild(ring);

      var cursorX = 0, cursorY = 0;      /* 실제 커서 */
      var ringX = 0, ringY = 0;          /* 링 (조금 늦게 따라옴) */
      var auroraX = 0, auroraY = 0;      /* 오로라 (더 느리게 흐름) */
      var seen = false;
      var lastSpark = 0;
      var tiltedCard = null;             /* 지금 기울어져 있는 카드 */

      document.addEventListener('pointermove', function (event) {
        cursorX = event.clientX;
        cursorY = event.clientY;

        if (!seen) {
          /* 첫 움직임에서는 순간이동시켜 화면 구석에서 날아오지 않게 합니다. */
          ringX = auroraX = cursorX;
          ringY = auroraY = cursorY;
          seen = true;
          ring.classList.add('is-visible');
        }

        var hit = event.target instanceof Element
          ? event.target.closest('a, button, .card-wrapper, .post-tag, #search-input')
          : null;
        ring.classList.toggle('is-active', !!hit);

        /* 트레일: 너무 촘촘하면 지저분해서 간격을 둡니다. */
        var now = event.timeStamp;
        if (now - lastSpark > 45) {
          lastSpark = now;
          spawn('cursor-spark', cursorX, cursorY, 600);
        }

        /* 카드 3D 틸트 */
        var card = event.target instanceof Element
          ? event.target.closest('#post-list .card-wrapper')
          : null;
        if (card !== tiltedCard) {
          if (tiltedCard) {
            tiltedCard.style.removeProperty('--tilt-x');
            tiltedCard.style.removeProperty('--tilt-y');
          }
          tiltedCard = card;
        }
        if (card) {
          var box = card.getBoundingClientRect();
          var px = (cursorX - box.left) / box.width - 0.5;
          var py = (cursorY - box.top) / box.height - 0.5;
          card.style.setProperty('--tilt-y', (px * 6).toFixed(2) + 'deg');
          card.style.setProperty('--tilt-x', (-py * 6).toFixed(2) + 'deg');
          card.style.setProperty('--mx', (cursorX - box.left).toFixed(1) + 'px');
          card.style.setProperty('--my', (cursorY - box.top).toFixed(1) + 'px');
        }
      }, { passive: true });

      document.addEventListener('mouseleave', function () {
        ring.classList.remove('is-visible');
      });
      document.addEventListener('mouseenter', function () {
        if (seen) ring.classList.add('is-visible');
      });

      document.addEventListener('click', function (event) {
        spawn('click-ripple', event.clientX, event.clientY, 620);
      }, { passive: true });

      /* 짧게 살았다 사라지는 요소를 만듭니다. */
      function spawn(className, x, y, life) {
        var node = document.createElement('div');
        node.className = className;
        node.setAttribute('aria-hidden', 'true');
        node.style.setProperty('--sx', x.toFixed(1) + 'px');
        node.style.setProperty('--sy', y.toFixed(1) + 'px');
        if (className === 'cursor-spark') {
          /* 입자마다 다른 방향으로 조금씩 흩어지게 합니다. */
          node.style.setProperty('--dx', (Math.random() * 26 - 13).toFixed(1) + 'px');
          node.style.setProperty('--dy', (Math.random() * 26 - 13).toFixed(1) + 'px');
        }
        body.appendChild(node);
        setTimeout(function () { node.remove(); }, life);
      }

      (function loop() {
        ringX += (cursorX - ringX) * 0.2;
        ringY += (cursorY - ringY) * 0.2;
        ring.style.transform = 'translate(' + ringX.toFixed(1) + 'px, ' + ringY.toFixed(1) + 'px)';

        /* 오로라는 훨씬 느리게 따라와 배경이 천천히 흐르는 느낌을 냅니다. */
        auroraX += (cursorX - auroraX) * 0.04;
        auroraY += (cursorY - auroraY) * 0.04;
        body.style.setProperty('--ax', auroraX.toFixed(0) + 'px');
        body.style.setProperty('--ay', auroraY.toFixed(0) + 'px');
        body.style.setProperty('--bx', (window.innerWidth - auroraX).toFixed(0) + 'px');
        body.style.setProperty('--by', (window.innerHeight - auroraY).toFixed(0) + 'px');

        requestAnimationFrame(loop);
      })();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', start);
    } else {
      start();
    }
  })();
</script>
